---
- name: Setup Shopflow server
  hosts: shopflow
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist

    - name: Download k3s install script
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'

    - name: Install k3s
      command: sh /tmp/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s node to be ready
      command: k3s kubectl get nodes
      register: k3s_nodes
      until: "'Ready' in k3s_nodes.stdout"
      retries: 10
      delay: 10

    - name: Create argocd namespace
      command: k3s kubectl create namespace argocd
      args:
        creates: /tmp/.argocd-ns-created
      register: argocd_ns
      failed_when: false

    - name: Install ArgoCD
      command: k3s kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

    - name: Install cert-manager
      command: k3s kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml

    - name: Install sealed-secrets controller
      command: k3s kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.1/controller.yaml
