name: CI - Build and Push Images

on:
  push:
    branches:
      - main

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push catalog
        uses: docker/build-push-action@v6
        with:
          context: ./apps/catalog
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/catalog:latest
